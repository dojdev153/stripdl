name: Strip Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing or new release tag, for example v0.4.0"
        required: true
        type: string

permissions:
  contents: read

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  validate:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Validate tag and project version
        id: version
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          VERSION=$(python .github/scripts/verify_release_tag.py --tag "$RELEASE_TAG" --print-version)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          python scripts/sync_version.py --check

  build-linux-arm64-cli:
    name: Build Linux ARM64 CLI
    needs: validate
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: python -m pip install -r core/requirements.txt pyinstaller

      - name: Build standalone CLI
        run: python build_cli.py

      - name: Upload native Linux ARM64 CLI
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-cli-native
          if-no-files-found: error
          path: desktop/resources/strip-cli/stripdl

  package:
    name: ${{ matrix.name }}
    needs: [validate, build-linux-arm64-cli]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            platform: windows
            builder: win
            arch: x64
          - name: Windows arm64
            runner: windows-11-arm
            platform: windows
            builder: win
            arch: arm64
          - name: macOS x64
            runner: macos-15-intel
            platform: macos
            builder: mac
            arch: x64
          - name: macOS arm64
            runner: macos-latest
            platform: macos
            builder: mac
            arch: arm64
          - name: Linux x64
            runner: ubuntu-24.04
            platform: linux
            builder: linux
            arch: x64
          - name: Linux arm64
            runner: ubuntu-24.04
            platform: linux
            builder: linux
            arch: arm64
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install -r core/requirements.txt pyinstaller
          npm ci --prefix desktop

      - name: Generate and verify Strip assets
        run: |
          python scripts/generate_release_assets.py
          python scripts/verify_release_assets.py

      - name: Build standalone CLI
        if: ${{ matrix.platform != 'linux' || matrix.arch != 'arm64' }}
        run: python build_cli.py

      - name: Package standalone CLI artifact
        if: ${{ matrix.platform != 'linux' || matrix.arch != 'arm64' }}
        run: >-
          python .github/scripts/package_cli.py
          --version "${{ needs.validate.outputs.version }}"
          --platform "${{ matrix.platform }}"
          --arch "${{ matrix.arch }}"

      - name: Download native Linux ARM64 CLI
        if: ${{ matrix.platform == 'linux' && matrix.arch == 'arm64' }}
        uses: actions/download-artifact@v4
        with:
          name: linux-arm64-cli-native
          path: desktop/resources/strip-cli

      - name: Restore native CLI permissions
        if: ${{ matrix.platform == 'linux' && matrix.arch == 'arm64' }}
        run: chmod +x desktop/resources/strip-cli/stripdl

      - name: Package native Linux ARM64 CLI artifact
        if: ${{ matrix.platform == 'linux' && matrix.arch == 'arm64' }}
        run: >-
          python .github/scripts/package_cli.py
          --version "${{ needs.validate.outputs.version }}"
          --platform linux
          --arch arm64
          --source desktop/resources/strip-cli/stripdl

      - name: Build Electron bundles
        run: npm run build --prefix desktop

      - name: Build Electron installer
        working-directory: desktop
        run: >-
          npx electron-builder
          --${{ matrix.builder }}
          --${{ matrix.arch }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strip-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            release-cli/*
            desktop/release/*.dmg
            desktop/release/*.exe
            desktop/release/*.AppImage
            desktop/release/*.deb

  publish:
    name: Publish GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: strip-*
          path: release
          merge-multiple: true

      - name: Create checksums
        run: python .github/scripts/create_checksums.py --root release --output release/SHA256SUMS.txt

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          mapfile -d '' RELEASE_FILES < <(find release -type f -print0)
          gh release create "$RELEASE_TAG" "${RELEASE_FILES[@]}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Strip $RELEASE_VERSION" \
            --generate-notes
